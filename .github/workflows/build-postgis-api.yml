name: Build and push postgis-api

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["deployments/**"]
  pull_request:
    branches: [main]
    paths: ["deployments/**"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postgis-api

jobs:
  check-version-bump:
    # Only run on PRs — ensures version in pyproject.toml is bumped before merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to read main branch

      - name: Check version was bumped
        run: |
          get_version() {
            grep '^version = ' "$1" | sed 's/version = "\(.*\)"/\1/'
          }
          PR_VERSION=$(get_version deployments/postgis-api/pyproject.toml)
          MAIN_VERSION=$(git show origin/main:deployments/postgis-api/pyproject.toml | grep '^version = ' | sed 's/version = "\(.*\)"/\1/')
          echo "main: $MAIN_VERSION  →  pr: $PR_VERSION"
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "❌ Version not bumped (still $PR_VERSION). Update version in deployments/postgis-api/pyproject.toml."
            exit 1
          fi
          echo "✓ Version bumped"

  build-and-push:
    # Run on push to main or on version tags — not on PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Always tag with short git SHA (e.g. a1b2c3d)
            type=sha,prefix=,format=short
            # On v*.*.* tags, also tag with the semver (e.g. 1.2.3)
            type=semver,pattern={{version}}
            # Tag latest on every push to main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deployments
          file: deployments/postgis-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
